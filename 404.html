<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stranica nije pronađena | VD FLOW</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .error-container {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 2rem;
            margin: 20px 0 10px;
        }
        .error-text {
            color: #a0aec0;
            max-width: 500px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <a href="index.html">
                <span class="logo-text">VD FLOW</span>
            </a>
        </div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Početna</a></li>
                <li><a href="o-nama.html">O nama</a></li>
                <li><a href="usluge.html">Usluge</a></li>
                <li><a href="cjenik.html">Cjenik</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
        <a href="kontakt.html" class="btn-primary">Zatraži ponudu</a>
    </header>

    <main class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Stranica nije pronađena</h2>
        <p class="error-text">Stranica koju tražite ne postoji, premještena je ili je unesena kriva adresa.</p>
        <a href="index.html" class="btn-primary">Vrati se na početnu</a>
    </main>

    <footer class="footer">
        <p>&copy; 2026 VD FLOW. Sva prava pridržana.</p>
    </footer>

</body>
</html>
